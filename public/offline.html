<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4f8f" />
    <title>Đang mất kết nối - Bích Ngọc Florist</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: linear-gradient(160deg, #eae4f5, #fbf9fc 58%, #e8f1f9); color: #272431; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 32px 24px; border-radius: 24px; background: rgba(255, 255, 255, .92); box-shadow: 0 18px 55px rgba(56, 42, 85, .14); text-align: center; }
      .icon { width: 80px; height: 80px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 24px; background: #1f4f8f; color: #fff; font-size: 38px; }
      h1 { margin: 0; font-size: 1.65rem; line-height: 1.2; }
      p { margin: 12px 0 24px; color: #666170; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 999px; background: #272431; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">✿</div>
      <h1>Chưa có kết nối mạng</h1>
      <p>Dữ liệu quản lý cần kết nối Internet để luôn chính xác. Hãy kiểm tra Wi-Fi hoặc 4G/5G rồi thử lại.</p>
      <a href="/admin">Thử kết nối lại</a>
    </main>
  </body>
</html>
